name: Release

# Triggers on version tags (e.g. v0.3.0) or manual dispatch
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3)
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-target: aarch64-apple-darwin
          # macOS Intel
          - platform: macos-13
            args: '--target x86_64-apple-darwin'
            rust-target: x86_64-apple-darwin
          # Windows (MSI + EXE)
          - platform: windows-latest
            args: ''
            rust-target: ''
          # Linux (AppImage + deb)
          - platform: ubuntu-22.04
            args: ''
            rust-target: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node is needed only to install the Tauri CLI npm package.
      # We don't build Next.js here — the app loads dotstell.app via WebView at runtime.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Required by webkit2gtk / appindicator on Linux
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # tauri.conf.json frontendDist: "../dist" must point to an existing directory
      - name: Create dist placeholder
        run: mkdir -p dist
        shell: bash

      # Extract the section for the current tag from CHANGELOG.md.
      # Reads from ## [vX.Y.Z] down to (but not including) the next ## [
      - name: Extract changelog section
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          BODY=$(awk "/^## \[${TAG}\]/{flag=1; next} /^## \[v[0-9]/{flag=0} flag" CHANGELOG.md)
          BODY="${BODY}"$'\n\n---\n\n## Downloads\n\n| Platform | File |\n|---|---|\n| Windows (installer) | `Dotstell_*_x64_en-US.msi` |\n| Windows (setup) | `Dotstell_*_x64-setup.exe` |\n| macOS Apple Silicon | `Dotstell_*_aarch64.dmg` |\n| macOS Intel | `Dotstell_*_x64.dmg` |\n| Linux | `dotstell_*_amd64.AppImage` / `.deb` |\n\n> **Note:** Builds are currently unsigned. macOS: right-click the `.dmg` and choose **Open** to bypass Gatekeeper. Windows: click **More info → Run anyway** on the SmartScreen prompt.'
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Dotstell ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          tauriScript: tauri
