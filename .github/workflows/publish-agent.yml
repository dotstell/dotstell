name: Publish Agent to npm

# Triggers on agent-specific version tags, e.g. agent-v1.0.1
on:
  push:
    tags:
      - 'agent-v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Publish @dotstell/agent
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify package version matches tag
        run: |
          TAG="${{ github.ref_name }}"           # e.g. agent-v1.0.1
          PKG_VERSION="$(node -p "require('./package.json').version")"   # e.g. 1.0.1
          TAG_VERSION="${TAG#agent-v}"           # strip "agent-v" prefix → 1.0.1
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            echo "   Update packages/agent/package.json to version $TAG_VERSION before tagging."
            exit 1
          fi
          echo "✅ Version $PKG_VERSION matches tag $TAG"
        working-directory: packages/agent

      - name: Publish to npm
        run: npm publish
        working-directory: packages/agent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
