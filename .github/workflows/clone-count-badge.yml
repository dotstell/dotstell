name: Update Clone Count Badge

on:
  schedule:
    - cron: '17 3 * * *' # once daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-badge:
    name: Update badges/clones.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch clone traffic and update badge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-clone-badge.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/clones.json
          git diff --cached --quiet || git commit -m "Update clone count badge"
          git push
