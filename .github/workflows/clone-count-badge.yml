name: Update Clone Count Badge

on:
  schedule:
    - cron: '17 3 * * *' # once daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-badge:
    name: Update badges/clones.json
    runs-on: ubuntu-latest
    steps:
      # Both main and develop require PRs for everyone, including the default Actions
      # token -- confirmed by an actual failed run (GH006: Protected branch update
      # failed). Checking out with TRAFFIC_READ_TOKEN instead authenticates the later
      # push as the PAT's own (admin) account; both branches have enforce_admins: false,
      # so an admin's direct push bypasses the PR requirement.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_READ_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch clone traffic and update badge
        # The default GITHUB_TOKEN isn't accepted by the Traffic API (403 "Resource not
        # accessible by integration") -- reading clone/traffic stats requires a token tied
        # to an account with real push access to the repo, which the ephemeral Actions
        # token doesn't have even with contents:write. TRAFFIC_READ_TOKEN is a classic PAT
        # (repo scope) stored as a repository secret for exactly this call.
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_READ_TOKEN }}
        run: node .github/scripts/update-clone-badge.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/clones.json
          git diff --cached --quiet || git commit -m "Update clone count badge"
          git push
