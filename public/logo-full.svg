<svg width="480" height="120" viewBox="0 0 480 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background pill -->
  <rect width="480" height="120" rx="16" fill="#0a0a0f"/>

  <!-- Constellation lines -->
  <line x1="35" y1="42" x2="60" y2="25" stroke="#7c6aff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="60" y1="25" x2="88" y2="38" stroke="#7c6aff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="88" y1="38" x2="82" y2="68" stroke="#7c6aff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="82" y1="68" x2="50" y2="74" stroke="#7c6aff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="50" y1="74" x2="35" y2="42" stroke="#7c6aff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="60" y1="25" x2="82" y2="68" stroke="#7c6aff" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Glow halos -->
  <circle cx="60" cy="25" r="8" fill="#7c6aff" fill-opacity="0.12"/>
  <circle cx="88" cy="38" r="6" fill="#7c6aff" fill-opacity="0.12"/>
  <circle cx="82" cy="68" r="7" fill="#7c6aff" fill-opacity="0.12"/>
  <circle cx="50" cy="74" r="5" fill="#7c6aff" fill-opacity="0.12"/>
  <circle cx="35" cy="42" r="6" fill="#7c6aff" fill-opacity="0.12"/>

  <!-- Outer dots -->
  <circle cx="60" cy="25" r="4" fill="#7c6aff"/>
  <circle cx="88" cy="38" r="3" fill="#a594ff"/>
  <circle cx="82" cy="68" r="3.5" fill="#7c6aff"/>
  <circle cx="50" cy="74" r="3" fill="#a594ff"/>
  <circle cx="35" cy="42" r="3.5" fill="#7c6aff"/>

  <!-- Dashed spokes to center -->
  <line x1="60" y1="49" x2="60" y2="25" stroke="#7c6aff" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="2.5 2.5"/>
  <line x1="60" y1="49" x2="88" y2="38" stroke="#7c6aff" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="2.5 2.5"/>
  <line x1="60" y1="49" x2="82" y2="68" stroke="#7c6aff" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="2.5 2.5"/>
  <line x1="60" y1="49" x2="50" y2="74" stroke="#7c6aff" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="2.5 2.5"/>
  <line x1="60" y1="49" x2="35" y2="42" stroke="#7c6aff" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="2.5 2.5"/>

  <!-- Center hub -->
  <circle cx="60" cy="49" r="12" fill="#7c6aff" fill-opacity="0.12"/>
  <circle cx="60" cy="49" r="7" fill="#7c6aff" fill-opacity="0.3"/>
  <circle cx="60" cy="49" r="4.5" fill="#7c6aff"/>
  <circle cx="60" cy="49" r="2" fill="white" fill-opacity="0.9"/>

  <!-- Wordmark: dotstell -->
  <text x="118" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="700" letter-spacing="-1" fill="#e8e8f0">dots</text>
  <text x="228" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="700" letter-spacing="-1" fill="#7c6aff">tell</text>

  <!-- Tagline -->
  <text x="119" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#6b6b88" letter-spacing="0.5">connect your knowledge</text>
</svg>
