<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Constellation connection lines -->
  <line x1="60" y1="80" x2="100" y2="50" stroke="#7c6aff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="100" y1="50" x2="145" y2="72" stroke="#7c6aff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="145" y1="72" x2="130" y2="120" stroke="#7c6aff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="130" y1="120" x2="80" y2="130" stroke="#7c6aff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="80" y1="130" x2="60" y2="80" stroke="#7c6aff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="100" y1="50" x2="130" y2="120" stroke="#7c6aff" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="60" y1="80" x2="130" y2="120" stroke="#7c6aff" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Outer glow dots -->
  <circle cx="100" cy="50" r="10" fill="#7c6aff" fill-opacity="0.15"/>
  <circle cx="145" cy="72" r="7" fill="#7c6aff" fill-opacity="0.15"/>
  <circle cx="130" cy="120" r="9" fill="#7c6aff" fill-opacity="0.15"/>
  <circle cx="80" cy="130" r="7" fill="#7c6aff" fill-opacity="0.15"/>
  <circle cx="60" cy="80" r="8" fill="#7c6aff" fill-opacity="0.15"/>

  <!-- Core dots -->
  <circle cx="100" cy="50" r="5.5" fill="#7c6aff"/>
  <circle cx="145" cy="72" r="4" fill="#a594ff"/>
  <circle cx="130" cy="120" r="5" fill="#7c6aff"/>
  <circle cx="80" cy="130" r="4" fill="#a594ff"/>
  <circle cx="60" cy="80" r="4.5" fill="#7c6aff"/>

  <!-- Center hub dot — the brightest, the "you" -->
  <circle cx="100" cy="95" r="14" fill="#7c6aff" fill-opacity="0.12"/>
  <circle cx="100" cy="95" r="8" fill="#7c6aff" fill-opacity="0.25"/>
  <circle cx="100" cy="95" r="5" fill="#7c6aff"/>
  <circle cx="100" cy="95" r="2.5" fill="white" fill-opacity="0.9"/>

  <!-- Lines to center hub -->
  <line x1="100" y1="95" x2="100" y2="50" stroke="#7c6aff" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <line x1="100" y1="95" x2="145" y2="72" stroke="#7c6aff" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <line x1="100" y1="95" x2="130" y2="120" stroke="#7c6aff" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <line x1="100" y1="95" x2="80" y2="130" stroke="#7c6aff" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <line x1="100" y1="95" x2="60" y2="80" stroke="#7c6aff" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3"/>
</svg>
