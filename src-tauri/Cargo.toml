[package]
name = "dotstell"
version = "0.3.0"
description = "Dotstell — your knowledge graph"
authors = ["Dotstell <hello@dotstell.com>"]
edition = "2021"

[lib]
name = "dotstell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dotstell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
